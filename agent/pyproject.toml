[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boredagent"
version = "1.0.0"
description = "Fleet agent for Bored Manager: template-driven services, continuous reachability and public-IP monitoring, and daily telemetry."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Bored Manager" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "typer>=0.15",
  "httpx>=0.28",
  "docker>=7.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
boredagent = "boredagent.cli:main"

[tool.setuptools.packages.find]
include = ["boredagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests import `boredagent` from the source tree rather than an install, so
# a failing test always names the file that is actually on disk.
pythonpath = [".", "tests"]
