name: sdk-drift
# shared/ and vendor/ are copies of app files pinned to one ref in
# sdk.lock.json (see scripts/sync-sdk.mjs). Nothing breaks the moment the app
# changes one - a module compiled against an older SDK still installs - but this
# is the only place that would ever notice, so ask once a week rather than
# finding out from a type error after the next re-pin.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-sdk.mjs --against main
