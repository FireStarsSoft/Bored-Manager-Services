name: agent
on:
  push:
    branches: [main]
    paths: ['agent/**', 'scripts/package-agent.mjs', '.github/workflows/agent.yml']
  pull_request:
    paths: ['agent/**', 'scripts/package-agent.mjs', '.github/workflows/agent.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python -m pip install --upgrade pip
      - run: pip install -e './agent[dev]'
      - run: python -m pytest agent/tests -q
      # The installer runs as root on machines this repository never sees. A
      # syntax error in it is the kind of thing that is only discovered by the
      # person it breaks, so it is checked here instead.
      - name: Check the installer parses
        run: bash -n agent/install/agent-install.sh
      # The unit file is the other thing that has to be right on a machine
      # nobody here can watch. systemd can verify one without installing it.
      - name: Check the systemd unit parses
        run: |
          sudo cp agent/systemd/boredagent.service /etc/systemd/system/boredagent-check.service
          sudo systemd-analyze verify /etc/systemd/system/boredagent-check.service
          sudo rm -f /etc/systemd/system/boredagent-check.service
      - run: npm ci
      - run: npm run agent:pack
      # Everything the fleet needs has to actually be inside the archive, and
      # at the depth the module's installer script looks for it.
      - name: Verify the archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/unpack && tar xzf dist/*.tar.gz -C /tmp/unpack
          test -n "$(find /tmp/unpack -maxdepth 4 -name agent-install.sh -print -quit)"
          test -n "$(find /tmp/unpack -maxdepth 4 -name boredagent.service -print -quit)"
          test -n "$(find /tmp/unpack -maxdepth 4 -name requirements.txt -print -quit)"
          test -x "$(find /tmp/unpack -maxdepth 4 -name agent-install.sh -print -quit)"
